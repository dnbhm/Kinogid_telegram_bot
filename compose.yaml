services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: .env
    environment:
      DB_PATH: /app/data/kinogid.sqlite3
    volumes:
      - bot_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
